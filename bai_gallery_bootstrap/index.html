<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery ảnh Bootstrap</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <main class="container py-4">
        <h1 class="mb-2">Gallery ảnh</h1>
        <p class="text-muted mb-4">Khám phá những hình ảnh thiên nhiên và cuộc sống.</p>
        <div class="row g-4">
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="card h-100 shadow-sm">
                    <a href="landscape.jpg" target="_blank" rel="noopener"><img src="landscape.jpg" class="card-img-top img-fluid" alt="Phong cảnh núi và thung lũng"></a>
                    <figcaption class="card-body text-center">Phong cảnh thiên nhiên</figcaption>
                </figure>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="card h-100 shadow-sm">
                    <a href="river.jpg" target="_blank" rel="noopener"><img src="river.jpg" class="card-img-top img-fluid" alt="Dòng sông uốn lượn giữa vùng núi"></a>
                    <figcaption class="card-body text-center">Dòng sông giữa núi</figcaption>
                </figure>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="card h-100 shadow-sm">
                    <a href="mountains.jpg" target="_blank" rel="noopener"><img src="mountains.jpg" class="card-img-top img-fluid" alt="Cảnh quan núi và thung lũng nhìn từ trên cao"></a>
                    <figcaption class="card-body text-center">Núi và thung lũng</figcaption>
                </figure>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <figure class="card h-100 shadow-sm">
                    <a href="dog.jpg" target="_blank" rel="noopener"><img src="dog.jpg" class="card-img-top img-fluid" alt="Chú chó được quấn trong chiếc chăn"></a>
                    <figcaption class="card-body text-center">Người bạn nhỏ</figcaption>
                </figure>
            </div>
        </div>
        <p class="mt-4 text-muted">Nhấp vào ảnh để xem kích thước lớn.</p>
    </main>
</body>
</html>
