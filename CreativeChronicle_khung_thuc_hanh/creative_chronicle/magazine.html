<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreativeChronicle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-4">
        <h1>CreativeChronicle</h1>
        <!-- Học viên thêm cụm avatar + details và các nút chia sẻ.
             Có thể dùng d-flex align-items-center justify-content-between
             flex-wrap gap-3 trên thanh tác giả. -->
        <div class="author-section"></div>

        <!-- Ví dụ component Grid độc lập; học viên thay bằng ảnh thật. -->
        <div class="mosaic-gallery my-4">
            <div class="photo-main bg-light p-3">Main Photo</div>
            <div class="photo-sub-1 bg-light p-3">Sub Photo 1</div>
            <div class="photo-sub-2 bg-light p-3">Sub Photo 2</div>
        </div>
        <p>Nội dung bài báo được đặt sau gallery.</p>
        <h2>Bài viết đề xuất</h2>
        <!-- Học viên thêm 4 phần tử col-12 col-md-6 col-lg-3,
             mỗi phần tử chứa Bootstrap card h-100 và card-body. -->
        <div class="row g-3"></div>
    </main>
</body>
</html>
